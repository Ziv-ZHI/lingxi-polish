<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" role="img" aria-label="BURNISH system architecture: Qt host PC over UDP to an ARM Cortex controller, EtherCAT 2 ms to joints and a KWR75 force sensor, with ROS vision and a cloud edge gateway feeding a WeChat mini program" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#55555A"/>
    </marker>
    <marker id="arrowDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3F6B3A"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="520" fill="#FFFFFF"/>

  <text x="40" y="30" font-size="14" font-weight="600" fill="#17394D">BURNISH — Collaborative Robotic Polishing System Architecture</text>

  <!-- ================= Layer 1: Operator PC ================= -->
  <rect x="40" y="52" width="480" height="86" rx="4" fill="#E8F1F8" stroke="#2E5C6E" stroke-width="1.5"/>
  <text x="56" y="74" font-size="14" font-weight="600" fill="#17394D">Operator PC — Qt 5.15 · VSCR-6EUR3-Monitor (Windows)</text>
  <text x="56" y="88" font-size="11" fill="#3D5C6B">engineer edition (5 modules) · operator edition (3-step job flow)</text>

  <g text-anchor="middle" font-size="11" fill="#17394D">
    <rect x="49"  y="96" width="86" height="30" rx="3" fill="#FFFFFF" stroke="#9FB6BF" stroke-width="1"/>
    <text x="92"  y="115">Monitoring</text>
    <rect x="143" y="96" width="86" height="30" rx="3" fill="#FFFFFF" stroke="#9FB6BF" stroke-width="1"/>
    <text x="186" y="115">Calibration</text>
    <rect x="237" y="96" width="86" height="30" rx="3" fill="#FFFFFF" stroke="#9FB6BF" stroke-width="1"/>
    <text x="280" y="115">Trajectory</text>
    <rect x="331" y="96" width="86" height="30" rx="3" fill="#FFFFFF" stroke="#9FB6BF" stroke-width="1"/>
    <text x="374" y="115">Tuning</text>
    <rect x="425" y="96" width="86" height="30" rx="3" fill="#FFFFFF" stroke="#9FB6BF" stroke-width="1"/>
    <text x="468" y="115">Task</text>
  </g>

  <line x1="280" y1="138" x2="280" y2="158" stroke="#55555A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ================= Layer 2: UDP ================= -->
  <rect x="40" y="160" width="480" height="46" rx="4" fill="#F0EEE9" stroke="#8A857A" stroke-width="1.5"/>
  <text x="280" y="180" text-anchor="middle" font-size="14" font-weight="600" fill="#3A3730">UDP link</text>
  <text x="280" y="196" text-anchor="middle" font-size="11" fill="#5B574E">command 5001 · telemetry 5002 · loss-timeout detection</text>

  <line x1="280" y1="206" x2="280" y2="226" stroke="#55555A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ================= Layer 3: ARM Cortex controller ================= -->
  <rect x="40" y="228" width="480" height="68" rx="4" fill="#FBF1E1" stroke="#7A4A12" stroke-width="1.5"/>
  <text x="280" y="252" text-anchor="middle" font-size="14" font-weight="600" fill="#4A2F0B">ARM Cortex controller</text>
  <text x="280" y="270" text-anchor="middle" font-size="11" fill="#6B4A20">firmware: .elf generated by Simulink MBD (model-based design)</text>
  <text x="280" y="285" text-anchor="middle" font-size="11" fill="#6B4A20">admittance force control · robust controller · safety envelope</text>

  <line x1="280" y1="296" x2="280" y2="316" stroke="#55555A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ================= Layer 4: EtherCAT ================= -->
  <rect x="40" y="318" width="480" height="46" rx="4" fill="#F0EEE9" stroke="#8A857A" stroke-width="1.5"/>
  <text x="280" y="338" text-anchor="middle" font-size="14" font-weight="600" fill="#3A3730">EtherCAT — 2 ms cycle</text>
  <text x="280" y="354" text-anchor="middle" font-size="11" fill="#5B574E">deterministic real-time fieldbus</text>

  <line x1="280" y1="364" x2="280" y2="384" stroke="#55555A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ================= Layer 5: Devices ================= -->
  <rect x="40" y="386" width="480" height="76" rx="4" fill="#E6F0EE" stroke="#2E5C6E" stroke-width="1.5"/>
  <text x="280" y="410" text-anchor="middle" font-size="14" font-weight="600" fill="#17394D">Robot joints + end effector</text>
  <text x="280" y="428" text-anchor="middle" font-size="11" fill="#3D5C6B">KWR75 6-axis force/torque sensor — constant-force polishing loop</text>
  <text x="280" y="446" text-anchor="middle" font-size="11" fill="#3D5C6B">workpiece 60×40 mm · 5 mm row pitch · 25 mm/s feed → 20.6 s cycle</text>

  <!-- ================= Right: ROS vision ================= -->
  <rect x="580" y="52" width="260" height="76" rx="4" fill="#EAF3E8" stroke="#3F6B3A" stroke-width="1.5"/>
  <text x="710" y="76" text-anchor="middle" font-size="14" font-weight="600" fill="#24401F">ROS vision node</text>
  <text x="710" y="94" text-anchor="middle" font-size="11" fill="#3F6B3A">camera intrinsics · calibration board</text>
  <text x="710" y="110" text-anchor="middle" font-size="11" fill="#3F6B3A">hand-eye: Eye-in-Hand / Eye-to-Hand</text>

  <path d="M 580 90 H 560 V 96 H 520" fill="none" stroke="#3F6B3A" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowDash)"/>
  <text x="524" y="86" text-anchor="end" font-size="11" fill="#3F6B3A">images + TCP poses</text>

  <!-- ================= Right: Edge gateway ================= -->
  <rect x="580" y="200" width="260" height="64" rx="4" fill="#EFEAF6" stroke="#5B4B8A" stroke-width="1.5"/>
  <text x="710" y="224" text-anchor="middle" font-size="14" font-weight="600" fill="#33255C">Edge gateway</text>
  <text x="710" y="242" text-anchor="middle" font-size="11" fill="#4B3C77">MQTT over TLS · HTTP uplink</text>
  <text x="710" y="256" text-anchor="middle" font-size="11" fill="#4B3C77">cloud command downlink</text>

  <path d="M 520 95 H 552 V 232 H 578" fill="none" stroke="#55555A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="556" y="176" font-size="11" fill="#55555A">1 s aggregate</text>

  <line x1="710" y1="264" x2="710" y2="286" stroke="#55555A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ================= Right: Cloud ================= -->
  <rect x="580" y="288" width="260" height="56" rx="4" fill="#EFEAF6" stroke="#5B4B8A" stroke-width="1.5"/>
  <text x="710" y="310" text-anchor="middle" font-size="14" font-weight="600" fill="#33255C">Cloud service</text>
  <text x="710" y="328" text-anchor="middle" font-size="11" fill="#4B3C77">device registry · history · alarms</text>

  <line x1="710" y1="344" x2="710" y2="366" stroke="#55555A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="722" y="358" font-size="11" fill="#55555A">WebSocket</text>

  <!-- ================= Right: Mini program ================= -->
  <rect x="580" y="368" width="260" height="94" rx="4" fill="#EFEAF6" stroke="#5B4B8A" stroke-width="1.5"/>
  <text x="710" y="392" text-anchor="middle" font-size="14" font-weight="600" fill="#33255C">WeChat mini program</text>
  <text x="710" y="410" text-anchor="middle" font-size="11" fill="#4B3C77">home · devices · data · work orders · me</text>
  <text x="710" y="428" text-anchor="middle" font-size="11" fill="#4B3C77">monitoring + work-order flow only —</text>
  <text x="710" y="444" text-anchor="middle" font-size="11" fill="#4B3C77">no real-time motion control on mobile</text>

  <text x="40" y="490" font-size="11" fill="#6B7280" font-style="italic">Wire protocol single source of truth: libs/burnishcore/protocol/FirmwareProtocol.h — shared with the firmware build.</text>
  <text x="40" y="506" font-size="11" fill="#6B7280" font-style="italic">Privileges: operator (execute) / engineer (tune) / admin (accounts) · SHA-256 store · CSV process logging.</text>
</svg>
